<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Pipeline Status Checker</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #0d6efd;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #0b5ed7;
        }

        #result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            font-weight: bold;
            display: none;
            /* Hidden until a check is made */
        }

        .status-good {
            background-color: #d1e7dd;
            color: #0f5132;
            border: 1px solid #badbcc;
        }

        .status-bad {
            background-color: #f8d7da;
            color: #842029;
            border: 1px solid #f5c2c7;
        }

        .status-other {
            background-color: #dbd7f8;
            color: #322084;
            border: 1px solid #c2c2f5;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Check Run Status</h2>
        <p style="color: #6c757d; font-size: 14px;">Enter the exact Run ID to check hardware processes.</p>

        <input type="text" id="runIdInput" placeholder="e.g., _4h">
        <button onclick="checkRunStatus()" id="checkBtn">Check Status</button>

        <div id="result-box"></div>
    </div>

    <script>
        async function checkRunStatus() {
            const runid = document.getElementById('runIdInput').value.trim();
            const resultBox = document.getElementById('result-box');
            const checkBtn = document.getElementById('checkBtn');

            if (!runid) {
                alert("Please enter a Run ID.");
                return;
            }

            // UI Loading state
            checkBtn.innerText = "Checking hardware...";
            checkBtn.disabled = true;
            resultBox.style.display = "none";
            resultBox.className = "";

            try {
                const response = await fetch(`/check_status?runid=${encodeURIComponent(runid)}`);
                const data = await response.json();

                resultBox.style.display = "block";
                console.log(data.is_running)

                if (data.is_running == "no run ID") {
                    resultBox.textContent = `❌ Pipeline ${data.runid} does not exist.`;
                    resultBox.className = "status-bad";
                } else if (data.is_running == "started") {
                    resultBox.textContent = `🟢 Pipeline ${data.runid} is started.`;
                    resultBox.className = "status-good";
                } else if (data.is_running == "killed") {
                    resultBox.textContent = `🔴 Pipeline ${data.runid} is killed.`;
                    resultBox.className = "status-bad";
                } else if (data.is_running == "finished") {
                    resultBox.textContent = `🏁 Pipeline ${data.runid} is finished.`;
                    resultBox.className = "status-other";
                }

            } catch (error) {
                resultBox.style.display = "block";
                resultBox.textContent = "Error communicating with the server.";
                resultBox.className = "status-stopped";
            } finally {
                // Reset button UI
                checkBtn.innerText = "Check Status";
                checkBtn.disabled = false;
            }
        }
    </script>
</body>

</html>
