<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}RICA-S{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    {% block head %}{% endblock %}
</head>

<body class="{% block body_class %}{% endblock %}">
    <div class="container {% block container_class %}{% endblock %}">
        {% for r in running_runs %}
        <div class="run-banner" data-runid="{{ r }}">
            <span class="run-icon" aria-hidden="true"></span>
            <span class="run-text">An experiment is running:
                <a href="{{ url_for('generate_report', runid=r) }}">{{ r }}</a></span>
        </div>
        {% endfor %}
        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>

</html>
