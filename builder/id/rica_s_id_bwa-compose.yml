services:
  rica_s_id_bwa:
    container_name: rica_s_id_bwa

    entrypoint:
      - /bin/bash

    hostname: rica_s_id_bwa
    working_dir: /

    image: alkanlab/rica_s_id_bwa:v1.3

    ipc: private

    logging:
      driver: json-file
      options: {}

    networks:
      - rica_s_net

    stdin_open: true

    tty: true

    volumes:
      - ${RICA_S_HOME:?run via builder/docker_control.sh or set RICA_S_HOME}:${RICA_S_HOME}

    # build:
    #   context: .
    #   dockerfile_inline: |
    #     FROM alkanlab/rica_s_id_bwa:v1.1
    #     RUN apt update && apt install -y nano less git wget samtools seqtk seqkit