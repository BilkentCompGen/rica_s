services:
  rica_s_id_ngmlr:
    container_name: rica_s_id_ngmlr
    entrypoint:
      - /bin/bash
    hostname: rica_s_id_ngmlr
    image: alkanlab/rica_s_id_ngmlr:v1.3
    working_dir: /

    ipc: private
    logging:
      driver: json-file
      options: {}
    networks:
      - rica_s_net
    stdin_open: true
    tty: true
    volumes:
      - ${RICA_S_HOME:?run via builder/docker_control.sh or set RICA_S_HOME}:${RICA_S_HOME}
