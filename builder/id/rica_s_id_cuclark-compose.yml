services:
  rica_s_id_cuclark:
    container_name: rica_s_id_cuclark

    entrypoint:
      - /bin/bash

    hostname: rica_s_id_cuclark
    working_dir: /

    image: alkanlab/rica_s_id_cuclark:v1.3

    ipc: private

    logging:
      driver: json-file
      options: {}

    networks:
      - rica_s_net

    stdin_open: true

    tty: true

    volumes:
      - ${RICA_S_HOME:?run via builder/docker_control.sh or set RICA_S_HOME}:${RICA_S_HOME}

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

