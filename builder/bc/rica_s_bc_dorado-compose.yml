services:
  rica_s_bc_dorado:
    container_name: rica_s_bc_dorado

    entrypoint:
      - /bin/bash

    hostname: rica_s_bc_dorado
    working_dir: /

    # image: staphb/dorado:0.9.0-cuda12.2.0
    image: alkanlab/rica_s_bc_dorado:0.9.0-cuda12.2.0

    ipc: private

    logging:
      driver: json-file
      options: {}

    networks:
      - rica_s_net

    stdin_open: true

    tty: true

    volumes:
      - ${RICA_S_HOME:?run via builder/docker_control.sh or set RICA_S_HOME}:${RICA_S_HOME}

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # build:
    #   context: .
    #   dockerfile_inline: |
